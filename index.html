<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VOX-99 Tactical Radio</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --lcd-bg: #8ba37e;
      --lcd-text: #162111;
      --accent-orange: #ff5722;
      --accent-green: #00e676;
      --accent-amber: #ffb300;
    }
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; background: #12151b;
      display: flex; justify-content: center; align-items: center;
      font-family: monospace; color: #e2e8f0; padding: 10px;
    }
    .radio-unit {
      width: 100%; max-width: 380px; background: #1f242d;
      border-radius: 28px; padding: 16px; border: 2px solid #333a48;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .status-bar {
      display: flex; justify-content: space-between; background: #111419;
      padding: 6px 10px; border-radius: 14px; font-size: 11px; margin-bottom: 12px;
      border: 1px solid #282d38;
    }
    .led { width: 8px; height: 8px; border-radius: 50%; background: #444; display: inline-block; margin-right: 4px; }
    .led.active { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
    .led.tx { background: var(--accent-orange); box-shadow: 0 0 8px var(--accent-orange); }
    
    .lcd {
      background: var(--lcd-bg); color: var(--lcd-text); border-radius: 8px;
      padding: 10px; min-height: 180px; display: flex; flex-direction: column;
      justify-content: space-between; margin-bottom: 12px; box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
    }
    .chat-log {
      height: 95px; overflow-y: auto; background: rgba(0,0,0,0.06);
      border-radius: 4px; padding: 4px; font-size: 12px; margin: 4px 0;
    }
    .row { display: flex; gap: 6px; margin-bottom: 8px; }
    input, button {
      background: #111419; border: 1px solid #333a48; color: #fff;
      padding: 8px; border-radius: 6px; font-size: 13px; outline: none; width: 100%;
    }
    button { background: #2b3240; cursor: pointer; font-weight: bold; }
    button.amber { border-color: var(--accent-amber); color: var(--accent-amber); }
    
    .ptt-btn {
      width: 100%; height: 70px; border-radius: 16px;
      background: linear-gradient(180deg, #ff5722, #c62828);
      border: 2px solid #ff8a65; color: #fff; font-size: 16px; font-weight: 900;
      cursor: pointer; box-shadow: 0 6px 0 #7f0000;
    }
    .ptt-btn:active, .ptt-btn.active { transform: translateY(4px); box-shadow: 0 2px 0 #7f0000; background: #d32f2f; }
  </style>
</head>
<body>

<div class="radio-unit">
  <div class="status-bar">
    <div><span id="connLed" class="led"></span><span id="connText">DISCONNECTED</span></div>
    <div><span id="txLed" class="led"></span>TX</div>
  </div>

  <div class="lcd">
    <div style="font-weight:bold; font-size:11px; border-bottom:1px dashed #445533; padding-bottom:2px;">
      CHANNEL: <span id="lblRoom">ALPHA-1</span> | PEERS: <span id="lblPeers">0</span>
    </div>
    <div class="chat-log" id="chatLog">
      <div>[SYS] Ready. Enter channel and tap Connect.</div>
    </div>
    <div style="font-size:11px;" id="micStatus">MIC: READY</div>
  </div>

  <div class="row">
    <input type="text" id="roomInput" value="ALPHA-1" placeholder="Room/Channel Name" />
    <button class="amber" onclick="connectChannel()">CONNECT</button>
  </div>
  <div class="row">
    <input type="text" id="msgInput" placeholder="Type message..." onkeydown="if(event.key==='Enter') sendText()" />
    <button onclick="sendText()">SEND</button>
  </div>

  <button class="ptt-btn" id="pttBtn">HOLD TO TALK (PTT)</button>
</div>

<script>
  let peer = null;
  let connections = new Map();
  let mediaCalls = new Map();
  let localStream = null;
  let isTransmitting = false;
  const myId = 'U-' + Math.floor(1000 + Math.random() * 9000);

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function beep(freq, duration) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  }

  function logMsg(sender, txt) {
    const log = document.getElementById('chatLog');
    log.innerHTML += `<div><b>[${sender}]</b> ${txt}</div>`;
    log.scrollTop = log.scrollHeight;
  }

  async function getMic() {
    if (localStream) return localStream;
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      localStream.getAudioTracks().forEach(t => t.enabled = false);
      document.getElementById('micStatus').textContent = 'MIC: ARMED';
      return localStream;
    } catch (e) {
      logMsg('ERR', 'Microphone blocked by browser!');
      return null;
    }
  }

  async function connectChannel() {
    await getMic();
    if (peer) { peer.destroy(); connections.clear(); }

    const room = document.getElementById('roomInput').value.trim().toUpperCase() || 'ALPHA-1';
    document.getElementById('lblRoom').textContent = room;
    logMsg('SYS', 'Connecting to ' + room + '...');

    // Try slots 0 to 5 to find an open node identity
    trySlot(room, 0);
  }

  function trySlot(room, slot) {
    const peerId = `vox99-${room}-${slot}`;
    // Configured with public STUN servers for cross-network/firewall stability
    peer = new Peer(peerId, {
      config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
    });

    peer.on('open', () => {
      document.getElementById('connLed').classList.add('active');
      document.getElementById('connText').textContent = 'ONLINE';
      logMsg('SYS', 'Connected as slot ' + slot);

      // Connect to other potential slots in the same room
      for (let i = 0; i < 5; i++) {
        if (i !== slot) connectTo(`vox99-${room}-${i}`);
      }
    });

    peer.on('connection', conn => setupData(conn));
    peer.on('call', call => {
      call.answer(localStream || undefined);
      setupCall(call);
    });

    peer.on('error', err => {
      if (err.type === 'unavailable-id' && slot < 5) {
        peer.destroy();
        trySlot(room, slot + 1);
      } else {
        logMsg('NET', 'Connection error. Check network.');
      }
    });
  }

  function connectTo(targetId) {
    if (!peer || connections.has(targetId)) return;
    const conn = peer.connect(targetId, { reliable: true });
    setupData(conn);
    if (localStream) {
      const call = peer.call(targetId, localStream);
      if (call) setupCall(call);
    }
  }

  function setupData(conn) {
    conn.on('open', () => {
      connections.set(conn.peer, conn);
      document.getElementById('lblPeers').textContent = connections.size;
      logMsg('SYS', 'Peer linked!');
    });
    conn.on('data', data => {
      if (data.type === 'text') {
        logMsg(data.sender, data.text);
        beep(1000, 0.08);
      } else if (data.type === 'ptt') {
        document.getElementById('txLed').classList.toggle('tx', data.active);
        if (!data.active) beep(1500, 0.1);
      }
    });
    conn.on('close', () => {
      connections.delete(conn.peer);
      document.getElementById('lblPeers').textContent = connections.size;
    });
  }

  function setupCall(call) {
    mediaCalls.set(call.peer, call);
    call.on('stream', stream => {
      let audio = document.getElementById('aud-' + call.peer);
      if (!audio) {
        audio = document.createElement('audio');
        audio.id = 'aud-' + call.peer;
        audio.autoplay = true;
        document.body.appendChild(audio);
      }
      audio.srcObject = stream;
    });
  }

  function broadcast(packet) {
    connections.forEach(c => { if (c.open) c.send(packet); });
  }

  function sendText() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;
    logMsg(myId, text);
    broadcast({ type: 'text', sender: myId, text });
    input.value = '';
  }

  async function startTX() {
    if (isTransmitting) return;
    await getMic();
    isTransmitting = true;
    document.getElementById('pttBtn').classList.add('active');
    document.getElementById('txLed').classList.add('tx');
    beep(1200, 0.05);
    if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = true);
    broadcast({ type: 'ptt', sender: myId, active: true });
  }

  function stopTX() {
    if (!isTransmitting) return;
    isTransmitting = false;
    document.getElementById('pttBtn').classList.remove('active');
    document.getElementById('txLed').classList.remove('tx');
    if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = false);
    beep(1500, 0.1);
    broadcast({ type: 'ptt', sender: myId, active: false });
  }

  const ptt = document.getElementById('pttBtn');
  ptt.addEventListener('mousedown', startTX);
  ptt.addEventListener('touchstart', e => { e.preventDefault(); startTX(); });
  window.addEventListener('mouseup', stopTX);
  window.addEventListener('touchend', stopTX);
</script>
</body>
</html>
